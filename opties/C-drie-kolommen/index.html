<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiteweer — drie kolommen</title>
<!-- PROTOTYPE. Throwaway option build for "shape-options" review. Do not ship as-is. -->
<link rel="stylesheet" href="../../tokens.css">
<style>
  /* ---- layout shell ---- */
  body{padding:0 0 40px;min-height:100vh}
  header.top{
    position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:12px 14px 10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  }
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;color:var(--fg)}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .switch button{padding:6px 12px;font-size:12px;color:var(--fg-2);transition:background var(--t),color var(--t)}
  .switch button[aria-pressed="true"]{background:var(--go-dim);color:var(--fg)}
  .switch button:hover{color:var(--fg)}
  .legend{font-size:11px;color:var(--fg-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .legend .lbl{display:inline-flex;align-items:center}

  main{padding:14px}
  table.board{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
  table.board thead th.spot-head{
    position:sticky;top:var(--top-h,53px);z-index:15;background:var(--bg);
    padding:8px 4px 10px;text-align:center;font-size:13px;font-weight:600;color:var(--fg);
    border-bottom:1px solid var(--line);
  }
  table.board thead th.spot-head small{display:block;font-weight:400;font-size:10px;color:var(--fg-3);margin-top:2px}
  th.time-col-head{width:52px}

  tr.day-row th{
    position:sticky;top:var(--day-h,96px);z-index:14;background:var(--surface-2);
    text-align:left;font-size:11px;color:var(--fg-2);font-weight:600;
    padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    text-transform:capitalize;
  }

  td.time{
    font-family:var(--f-mono);font-size:11px;color:var(--fg-3);
    padding:4px 6px;white-space:nowrap;vertical-align:middle;
  }

  td.cell{padding:3px;vertical-align:middle}
  .blk{
    position:relative;border-radius:var(--r-sm);border:1px solid var(--line);
    background:var(--surface);min-height:52px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:6px 2px;cursor:pointer;width:100%;text-align:center;
    transition:background var(--t),border-color var(--t),transform var(--t);
  }
  .blk:hover, .blk:focus-visible{background:var(--surface-2);border-color:var(--fg-3)}
  .blk .kn{font-family:var(--f-mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .blk .arrow{font-size:12px;line-height:1;color:var(--fg-2)}
  .blk .arrow svg{display:block;width:13px;height:13px}

  /* quality states */
  .blk.q-quiet .kn{color:var(--fg-2)}
  .blk.q-quiet .arrow{color:var(--fg-3)}
  .blk.q-good{background:rgba(61,220,132,.10);border-color:var(--go-dim)}
  .blk.q-good .kn{color:var(--go)}
  .blk.q-gusty{background:rgba(255,179,71,.10);border-color:#5a4523}
  .blk.q-gusty .kn{color:var(--warn)}
  .blk.q-offshore{background:rgba(255,92,92,.08);border-color:#5a2a2a}
  .blk.q-offshore .kn{color:var(--fg-2)}
  .blk.q-offshore .arrow{color:var(--no)}
  .blk.q-missing{background:var(--surface);border-style:dashed;color:var(--fg-3);cursor:default}
  .blk.q-missing .kn{color:var(--fg-3);font-size:11px;font-weight:400}

  .tag{position:absolute;top:2px;right:3px;font-size:8px;letter-spacing:.3px;color:var(--no);
    text-transform:uppercase;font-weight:700}

  /* ---- detail panel (popover-ish, anchored) ---- */
  #detail{
    position:fixed;z-index:50;max-width:250px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
    box-shadow:0 12px 28px rgba(0,0,0,.5);font-size:12px;color:var(--fg-2);
    display:none;
  }
  #detail.show{display:block}
  #detail h3{margin:0 0 6px;font-size:13px;color:var(--fg);font-weight:600}
  #detail .row{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
  #detail .row b{color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  #detail .safety{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--no);font-weight:600;font-size:11.5px}
  #detail .kite{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--go);font-weight:600;font-size:12.5px}
  #detail .note{margin-top:6px;font-size:11px;color:var(--fg-3)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:600px){
    th.time-col-head{width:36px}
    td.time{font-size:9.5px;padding:4px 2px}
    .blk{min-height:44px;padding:4px 1px}
    .blk .kn{font-size:13px}
    table.board thead th.spot-head{font-size:11px;padding:6px 2px 8px}
    table.board thead th.spot-head small{font-size:8.5px}
  }
</style>
</head>
<body>
<header class="top">
  <h1>Kiteweer</h1>
  <div class="controls">
    <div class="switch" role="group" aria-label="Weekkeuze">
      <button type="button" id="btn-live" aria-pressed="true">deze week</button>
      <button type="button" id="btn-demo" aria-pressed="false">winderige dag</button>
    </div>
    <div class="switch" role="group" aria-label="Board">
      <button type="button" data-board="twintip" aria-pressed="true">twintip</button>
      <button type="button" data-board="directional" aria-pressed="false">directional</button>
      <button type="button" data-board="foil" aria-pressed="false">foil</button>
    </div>
  </div>
  <div class="legend">
    <span class="lbl"><span class="dot" style="background:var(--go)"></span>goed</span>
    <span class="lbl"><span class="dot" style="background:var(--warn)"></span>vlagerig</span>
    <span class="lbl"><span class="dot" style="background:var(--no)"></span>aflandig — niet varen</span>
    <span class="lbl"><span class="dot" style="background:var(--fg-3)"></span>rustig</span>
  </div>
</header>

<main>
  <div class="board-wrap">
    <table class="board" id="board">
      <thead>
        <tr>
          <th class="time-col-head"><span class="sr">Tijd</span></th>
          <th class="spot-head" id="head-0"></th>
          <th class="spot-head" id="head-1"></th>
          <th class="spot-head" id="head-2"></th>
        </tr>
      </thead>
      <tbody id="board-body"></tbody>
    </table>
  </div>
</main>

<div id="detail" role="dialog" aria-modal="false" aria-labelledby="detail-title"></div>

<script src="../../data.js"></script>
<script>
(function(){
  "use strict";
  var KW = window.KW;
  var SPOTS = KW.spots; // fixed order, always the same
  var state = { mode: "live", board: "twintip" };

  var boardFactor = { twintip:1, directional:0.9, foil:0.6 };

  function dagLabel(d){
    var dagen = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
    return dagen[d.getDay()];
  }
  function dagKort(d){
    return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"});
  }
  function tijdLabel(t){
    var d = new Date(t);
    return d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  }
  function dagKey(t){ return t.slice(0,10); }

  // classification uses the generator's own flags directly (never re-derived):
  // aflandig = genuinely dangerous (offshore direction AND enough wind to matter)
  // rijdbaar = safe direction AND enough wind to ride
  // aflandigGeo = direction alone is offshore, regardless of wind strength
  function classify(blok){
    if(!blok) return "missing";
    if(blok.p50 == null) return "missing";
    if(blok.aflandig) return "offshore";
    if(blok.rijdbaar && blok.vlagerig) return "gusty";
    if(blok.rijdbaar) return "good";
    return "quiet";
  }

  function kiteSize(kn, board){
    if(kn < 14) return null;
    var m2 = 2.2 * KW.rider.gewicht / kn * boardFactor[board];
    return Math.round(m2*2)/2;
  }

  function windDirWoord(deg){
    var namen = ["noord","noordoost","oost","zuidoost","zuid","zuidwest","west","noordwest"];
    var ix = Math.round(((deg%360)+360)%360 / 45) % 8;
    return namen[ix];
  }

  function arrowSVG(deg){
    // wind FROM deg. Arrow points where wind blows TO (deg+180), a familiar convention for "flow" arrows.
    var rot = (deg + 180) % 360;
    return '<svg viewBox="0 0 16 16" style="transform:rotate(' + rot + 'deg)" aria-hidden="true">' +
      '<path d="M8 1 L13 11 L8 8.3 L3 11 Z" fill="currentColor"/></svg>';
  }

  function dataset(spot){ return state.mode === "live" ? spot.blokken : spot.demo; }

  function buildGrid(){
    // union of all timestamps across the 3 spots (they line up, but be defensive)
    var timesSet = {};
    SPOTS.forEach(function(s){ dataset(s).forEach(function(b){ timesSet[b.t]=true; }); });
    var times = Object.keys(timesSet).sort();

    var body = document.getElementById("board-body");
    body.innerHTML = "";

    var currentDay = null;
    times.forEach(function(t){
      var d = new Date(t);
      var dk = dagKey(t);
      if(dk !== currentDay){
        currentDay = dk;
        var dayRow = document.createElement("tr");
        dayRow.className = "day-row";
        var th = document.createElement("th");
        th.colSpan = 4;
        th.textContent = dagLabel(d) + " · " + dagKort(d);
        dayRow.appendChild(th);
        body.appendChild(dayRow);
      }

      var tr = document.createElement("tr");
      var tdTime = document.createElement("td");
      tdTime.className = "time";
      tdTime.textContent = tijdLabel(t);
      tr.appendChild(tdTime);

      SPOTS.forEach(function(spot, si){
        var blok = dataset(spot).filter(function(b){ return b.t === t; })[0];
        var td = document.createElement("td");
        td.className = "cell";
        var cls = classify(blok);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "blk q-" + cls;

        if(cls === "missing"){
          btn.disabled = true;
          btn.innerHTML = '<span class="kn">geen data</span>';
        } else {
          var kn = Math.round(blok.p50);
          btn.innerHTML =
            '<span class="kn num">' + kn + '</span>' +
            '<span class="arrow">' + arrowSVG(blok.dir) + '</span>' +
            (cls === "offshore" ? '<span class="tag">uit</span>' : "");
          btn.setAttribute("aria-haspopup","dialog");
          btn.addEventListener("click", function(e){ toggleDetail(e.currentTarget, spot, blok, cls); });
          btn.addEventListener("focus", function(e){ showDetail(e.currentTarget, spot, blok, cls); });
          btn.addEventListener("blur", function(){ scheduleHide(); });
          btn.addEventListener("mouseenter", function(e){ showDetail(e.currentTarget, spot, blok, cls); });
          btn.addEventListener("mouseleave", function(){ scheduleHide(); });
        }
        td.appendChild(btn);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  function setHeads(){
    SPOTS.forEach(function(s, i){
      var h = document.getElementById("head-"+i);
      h.innerHTML = s.naam + "<small>" + s.note + "</small>";
    });
  }

  var hideTimer = null;
  var openBtn = null;
  function scheduleHide(){
    hideTimer = setTimeout(function(){
      if(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("blk")) return;
      hideDetail();
    }, 120);
  }
  function hideDetail(){
    document.getElementById("detail").classList.remove("show");
    openBtn = null;
  }
  function toggleDetail(btn, spot, blok, cls){
    if(openBtn === btn){ hideDetail(); return; }
    showDetail(btn, spot, blok, cls);
  }
  function showDetail(btn, spot, blok, cls){
    clearTimeout(hideTimer);
    openBtn = btn;
    var panel = document.getElementById("detail");
    var html = '<h3 id="detail-title">' + spot.naam + ' · ' + tijdLabel(blok.t) + '</h3>';
    html += '<div class="row"><span>bereik</span><b>' + Math.round(blok.p10) + '–' + Math.round(blok.p90) + ' kn</b></div>';
    if(blok.vlaag != null){
      html += '<div class="row"><span>vlaag</span><b>' + Math.round(blok.vlaag) + ' kn</b></div>';
    }
    html += '<div class="row"><span>richting</span><b>' + windDirWoord(blok.dir) + '</b></div>';

    if(cls === "offshore"){
      html += '<div class="safety">Aflandig — wind waait van het strand af. Niet varen.</div>';
    } else if(blok.aflandigGeo){
      html += '<div class="note">Richting is aflandig, maar wind is te zwak om gevaarlijk te zijn.</div>';
    } else if(cls === "good" || cls === "gusty"){
      var maat = kiteSize(blok.p50, state.board);
      if(maat){
        html += '<div class="kite">kite: ' + maat + ' m² (' + state.board + ')</div>';
      }
    } else {
      html += '<div class="note">Te weinig wind om te varen.</div>';
    }
    if(cls === "gusty"){
      html += '<div class="note">Vlagerig — verschil tussen bereik en vlaag is groot.</div>';
    }
    panel.innerHTML = html;
    panel.classList.add("show");

    var r = btn.getBoundingClientRect();
    var pw = 250;
    var left = Math.min(Math.max(8, r.left + r.width/2 - pw/2), window.innerWidth - pw - 8);
    var top = r.bottom + 8;
    if(top + 180 > window.innerHeight){ top = r.top - 8; panel.style.transform = "translateY(-100%)"; }
    else { panel.style.transform = "none"; }
    panel.style.left = left + "px";
    panel.style.top = top + "px";
  }

  document.getElementById("detail").addEventListener("mouseenter", function(){ clearTimeout(hideTimer); });
  document.getElementById("detail").addEventListener("mouseleave", function(){ scheduleHide(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") hideDetail(); });

  document.getElementById("btn-live").addEventListener("click", function(){ setMode("live"); });
  document.getElementById("btn-demo").addEventListener("click", function(){ setMode("demo"); });
  function setMode(m){
    state.mode = m;
    document.getElementById("btn-live").setAttribute("aria-pressed", String(m==="live"));
    document.getElementById("btn-demo").setAttribute("aria-pressed", String(m==="demo"));
    hideDetail();
    buildGrid();
    setStickyOffsets();
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-board]"), function(btn){
    btn.addEventListener("click", function(){
      state.board = btn.getAttribute("data-board");
      Array.prototype.forEach.call(document.querySelectorAll("[data-board]"), function(b){
        b.setAttribute("aria-pressed", String(b === btn));
      });
      hideDetail();
    });
  });

  function setStickyOffsets(){
    var top = document.querySelector("header.top");
    var topH = top.getBoundingClientRect().height;
    document.documentElement.style.setProperty("--top-h", topH + "px");
    var head = document.getElementById("head-0");
    var headH = head ? head.getBoundingClientRect().height : 40;
    document.documentElement.style.setProperty("--day-h", (topH + headH) + "px");
  }

  setHeads();
  buildGrid();
  setStickyOffsets();
  window.addEventListener("resize", setStickyOffsets);
})();
</script>
</body>
</html>
