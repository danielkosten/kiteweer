<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiteweer — bandenstrook (prototype D)</title>
<!-- PROTOTYPE: wegwerpcode voor 1 richting (D: bandenstrook). Geen tests, geen build-stap. -->
<link rel="stylesheet" href="../../tokens.css">
<script src="../../data.js"></script>
<style>
  body{max-width:960px;margin:0 auto;padding:24px 20px 60px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.01em}
  .sub{color:var(--fg-3);font-size:12.5px;margin:2px 0 20px}

  .toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .toggle button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--fg-2);transition:background var(--t),color var(--t)}
  .toggle button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
  .toggle button:hover{color:var(--fg)}

  .legend{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 22px;font-size:12px;color:var(--fg-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:16px;height:10px;border-radius:2px;display:inline-block;flex:none}
  .sw-go{background:var(--go)}
  .sw-warn{background:var(--warn)}
  .sw-calm{background:var(--fg-3);opacity:.45}
  .sw-no{background:repeating-linear-gradient(135deg,var(--no) 0 3px,transparent 3px 6px);border:1px solid var(--no)}

  .rig{position:relative}
  .strip{position:relative;margin-bottom:2px}
  .strip-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 2px}
  .strip-head h2{font-size:13.5px;margin:0;font-weight:600;color:var(--fg)}
  .strip-head small{font-size:11px;color:var(--fg-3)}
  .stripbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
  svg.chart{display:block;width:100%;height:104px}
  .cursorline{stroke:var(--fg);stroke-width:1;opacity:.55;pointer-events:none}
  .thresh{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:2 3}
  .thresh-lbl{fill:var(--fg-3);font-size:9px;font-family:var(--f-mono)}
  .p50line{fill:none;stroke:var(--fg);stroke-width:1.1;opacity:.85}
  .gustmark{stroke:var(--fg);stroke-width:1;stroke-dasharray:1 2;opacity:.6}
  .nodata rect{fill:none}
  .nodata text{fill:var(--fg-3);font-size:9px}

  .axis{display:flex;justify-content:space-between;padding:4px 4px 0;font-size:10px;color:var(--fg-3);font-family:var(--f-mono)}

  .scrub{position:relative;margin-top:14px}
  .scrub input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
  .scrub input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
  .scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--fg);border:2px solid var(--bg)}
  .scrub input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
  .scrub input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:2px solid var(--bg)}
  .scrub-hint{font-size:11.5px;color:var(--fg-3);text-align:center;margin-top:2px}

  .readout{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;min-height:118px}
  .readout .when{font-size:12.5px;color:var(--fg-2);margin:0 0 10px;font-family:var(--f-mono)}
  .readout .empty{color:var(--fg-3);font-size:13px;text-align:center;padding:24px 0}
  .rows{display:grid;grid-template-columns:1fr;gap:8px}
  .row{display:flex;align-items:center;gap:10px;font-size:13px}
  .row .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .row .naam{width:112px;flex:none;color:var(--fg)}
  .row .knots{font-family:var(--f-mono);color:var(--fg);min-width:118px}
  .row .kite{color:var(--fg-2);font-size:12.5px}
  .row .flag{font-size:11.5px;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
  .flag.no{color:var(--no)}
  .flag.warn{color:var(--warn)}
  .flag.calm{color:var(--fg-3)}

  @media(max-width:520px){
    .row{flex-wrap:wrap}
    .row .naam{width:auto}
  }
</style>
</head>
<body>
<header>
  <h1>Kiteweer — bandenstrook</h1>
  <div class="toggle" role="group" aria-label="Databron">
    <button id="btn-live" type="button" aria-pressed="true">deze week</button>
    <button id="btn-demo" type="button" aria-pressed="false"></button>
  </div>
</header>
<p class="sub" id="periodLabel"></p>

<div class="legend" aria-hidden="true">
  <span><i class="swatch sw-go"></i>goede hoek</span>
  <span><i class="swatch sw-warn"></i>twijfel</span>
  <span><i class="swatch sw-calm"></i>te weinig wind</span>
  <span><i class="swatch sw-no"></i>aflandig — niet gaan</span>
</div>

<div class="rig" id="rig"></div>

<div class="scrub">
  <input type="range" id="scrub" min="0" max="0" value="0" step="1"
    aria-label="Tijdstip — pijltjestoetsen om door de tijdlijn te bewegen">
  <div class="scrub-hint" id="scrubHint">beweeg over de balken of gebruik de pijltjestoetsen voor cijfers</div>
</div>

<div class="readout" id="readout" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var KW = window.KW;
  var SPOTS = KW.spots;
  var Y_MIN = 0, Y_MAX = 28, THRESH = 14;
  var W = 1000, H = 104, PAD_T = 8, PAD_B = 8;
  var mode = "blokken"; // "blokken" = live week, "demo" = stormdag
  var idx = 0;

  document.getElementById("btn-demo").textContent = KW.demoLabel.replace(/^\w+ /,'').replace(/,.*$/,'') ;
  document.getElementById("btn-demo").textContent = "stormdag (demo)";

  function yPix(v){
    var t = (v - Y_MIN) / (Y_MAX - Y_MIN);
    return PAD_T + (1 - t) * (H - PAD_T - PAD_B);
  }
  function xPix(i, n){ return n <= 1 ? 0 : (i / (n - 1)) * W; }

  function quality(b){
    if (b.aflandig) return "no";
    if (b.p50 == null) return "gap";
    if (b.p50 < THRESH) return "calm";
    if (b.pct >= 60) return "go";
    return "warn";
  }
  var COLOR = { go: "var(--go)", warn: "var(--warn)", calm: "var(--fg-3)", no: "var(--no)" };

  function fmtTime(iso){
    var d = new Date(iso);
    var dagen = ["zo","ma","di","wo","do","vr","za"];
    var dag = dagen[d.getDay()];
    var hh = String(d.getHours()).padStart(2,"0");
    return dag + " " + d.getDate() + "/" + (d.getMonth()+1) + " " + hh + ":00";
  }
  function fmtShort(iso){
    var d = new Date(iso);
    var dagen = ["zo","ma","di","wo","do","vr","za"];
    return dagen[d.getDay()] + " " + String(d.getHours()).padStart(2,"0") + "u";
  }

  function kiteSize(kn){
    if (kn == null || kn < THRESH) return null;
    var m2 = 2.2 * KW.rider.gewicht / kn * KW.rider.boards.twintip;
    return Math.round(m2 * 2) / 2;
  }

  // --- build one strip's SVG markup ---
  function buildSvg(spot){
    var blokken = spot[mode];
    var n = blokken.length;
    var defs = '<defs><pattern id="hatch-' + spot.id + '" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
      '<rect width="6" height="6" fill="var(--surface-2)"/>' +
      '<line x1="0" y1="0" x2="0" y2="6" stroke="var(--no)" stroke-width="2" opacity=".55"/>' +
      '</pattern></defs>';

    var trapezoids = "";
    var gaps = "";
    for (var i = 0; i < n - 1; i++) {
      var a = blokken[i], b = blokken[i+1];
      var x0 = xPix(i, n), x1 = xPix(i+1, n);
      if (a.p10 == null || a.p90 == null || b.p10 == null || b.p90 == null) {
        gaps += '<g class="nodata" transform="translate(' + x0 + ',0)"><rect x="0" y="0" width="' + (x1-x0) + '" height="' + H + '"/>' +
          '<text x="' + ((x1-x0)/2) + '" y="' + (H/2) + '" text-anchor="middle">geen data</text></g>';
        continue;
      }
      var q = quality(a);
      var fill = q === "no" ? "url(#hatch-" + spot.id + ")" : COLOR[q];
      var op = q === "calm" ? "0.5" : (q === "no" ? "0.9" : "0.85");
      var y0t = yPix(a.p90), y0b = yPix(a.p10), y1t = yPix(b.p90), y1b = yPix(b.p10);
      trapezoids += '<path d="M' + x0 + ',' + y0t + ' L' + x1 + ',' + y1t + ' L' + x1 + ',' + y1b + ' L' + x0 + ',' + y0b + ' Z" fill="' + fill + '" opacity="' + op + '"></path>';
      if (a.vlagerig) {
        trapezoids += '<line class="gustmark" x1="' + x0 + '" y1="' + (y0t-3) + '" x2="' + x0 + '" y2="' + (y0t+3) + '"></line>';
      }
    }
    var p50pts = blokken.map(function(b, i){
      if (b.p50 == null) return null;
      return xPix(i, n) + "," + yPix(b.p50);
    }).filter(Boolean).join(" ");

    var threshY = yPix(THRESH);
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' +
      spot.naam + ': windband over tijd, drempel 14 knopen">' + defs +
      trapezoids + gaps +
      '<line class="thresh" x1="0" y1="' + threshY + '" x2="' + W + '" y2="' + threshY + '"></line>' +
      '<text class="thresh-lbl" x="4" y="' + (threshY - 3) + '">14 kn</text>' +
      '<polyline class="p50line" points="' + p50pts + '"></polyline>' +
      '<line class="cursorline" id="cur-' + spot.id + '" x1="0" y1="0" x2="0" y2="' + H + '"></line>' +
      '</svg>';
    return svg;
  }

  function renderRig(){
    var html = "";
    SPOTS.forEach(function(spot){
      html += '<div class="strip"><div class="strip-head"><h2>' + spot.naam + '</h2><small>' + spot.note + '</small></div>' +
        '<div class="stripbox">' + buildSvg(spot) + '</div></div>';
    });
    document.getElementById("rig").innerHTML = html;
    attachStripPointerEvents();
    updateCursor();
  }

  function attachStripPointerEvents(){
    var boxes = document.querySelectorAll(".stripbox");
    boxes.forEach(function(box){
      box.addEventListener("mousemove", function(e){
        var n = SPOTS[0][mode].length;
        var rect = box.getBoundingClientRect();
        var frac = (e.clientX - rect.left) / rect.width;
        frac = Math.max(0, Math.min(1, frac));
        var i = Math.round(frac * (n - 1));
        setIdx(i);
      });
      box.addEventListener("mouseleave", function(){
        // keep last cursor visible; readout stays for comparison, per "hover-only is not enough" rule
      });
    });
  }

  function setIdx(i){
    var n = SPOTS[0][mode].length;
    idx = Math.max(0, Math.min(n - 1, i));
    document.getElementById("scrub").value = idx;
    updateCursor();
  }

  function updateCursor(){
    var n = SPOTS[0][mode].length;
    var x = xPix(idx, n);
    SPOTS.forEach(function(spot){
      var line = document.getElementById("cur-" + spot.id);
      if (line) { line.setAttribute("x1", x); line.setAttribute("x2", x); }
    });
    renderReadout();
  }

  function renderReadout(){
    var out = document.getElementById("readout");
    var t = SPOTS[0][mode][idx].t;
    var rows = SPOTS.map(function(spot){
      var b = spot[mode][idx];
      var q = quality(b);
      var dot = '<i class="dot" style="background:' + (q === "no" ? "var(--no)" : (q === "gap" ? "var(--line)" : COLOR[q])) + '"></i>';
      var knots, extra;
      if (q === "gap") {
        knots = "geen data";
        extra = '<span class="kite">meting ontbreekt</span>';
      } else {
        knots = Math.round(b.p10) + "–" + Math.round(b.p90) + " kn <span style=\"color:var(--fg-3)\">(p50 " + Math.round(b.p50) + ")</span>";
        var gust = b.vlaag != null ? Math.round(b.vlaag) + " kn vlaag" : "geen vlaagdata";
        var richting = Math.round(b.dir) + "°";
        if (q === "no") {
          extra = '<span class="flag no">aflandig — niet gaan</span><span class="kite">' + richting + " · " + gust + "</span>";
        } else if (q === "calm") {
          extra = '<span class="flag calm">te weinig wind</span><span class="kite">' + richting + " · " + gust + "</span>";
        } else {
          var kite = kiteSize(b.p50);
          var flag = q === "warn" ? '<span class="flag warn">twijfelachtige hoek</span>' : "";
          extra = flag + '<span class="kite">' + richting + " · " + gust + (kite ? " · " + kite + "m² (twintip)" : "") + '</span>';
        }
      }
      return '<div class="row">' + dot + '<span class="naam">' + spot.naam + '</span><span class="knots">' + knots + '</span>' + extra + '</div>';
    }).join("");
    out.innerHTML = '<p class="when">' + fmtTime(t) + '</p><div class="rows">' + rows + '</div>';
  }

  function renderAxis(){
    // axis ticks drawn once under the whole rig, aligned to bottom strip via flex positions is imprecise for exact px,
    // so instead show a few evenly spaced labels matching the shared time domain.
    var n = SPOTS[0][mode].length;
    var ticks = mode === "demo" ? [0,1,2,3,4] : [0,8,16,24,32,40,47];
    var html = ticks.map(function(i){ return fmtShort(SPOTS[0][mode][i].t); }).join('<span></span>');
    // build as flex row
    var wrap = document.createElement("div");
    wrap.className = "axis";
    wrap.innerHTML = ticks.map(function(i){ return "<span>" + fmtShort(SPOTS[0][mode][i].t) + "</span>"; }).join("");
    var old = document.getElementById("axisRow");
    if (old) old.remove();
    wrap.id = "axisRow";
    document.getElementById("rig").after(wrap);
  }

  function setMode(next){
    mode = next;
    document.getElementById("btn-live").setAttribute("aria-pressed", String(mode === "blokken"));
    document.getElementById("btn-demo").setAttribute("aria-pressed", String(mode === "demo"));
    var n = SPOTS[0][mode].length;
    document.getElementById("scrub").max = n - 1;
    idx = 0;
    document.getElementById("scrub").value = 0;
    document.getElementById("periodLabel").textContent = mode === "demo"
      ? KW.demoLabel + " — harde wind, band ligt hoog en dik: onzekerheid over de piek."
      : "Live 6-daagse verwachting. Deze week is rustig: de band ligt vooral onder de 14-knopenlijn.";
    renderRig();
    renderAxis();
  }

  document.getElementById("btn-live").addEventListener("click", function(){ setMode("blokken"); });
  document.getElementById("btn-demo").addEventListener("click", function(){ setMode("demo"); });
  document.getElementById("scrub").addEventListener("input", function(e){ setIdx(parseInt(e.target.value, 10)); });

  setMode("blokken");
})();
</script>
</body>
</html>
