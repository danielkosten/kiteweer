<!DOCTYPE html>
<!-- PROTOTYPE — throwaway code, direction "A: nu-eerst". Not production. -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiteweer — nu eerst</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100vh}
  .top{display:flex;justify-content:flex-end;align-items:center;padding:var(--pad);gap:var(--gap)}
  .modeswitch{border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    font-size:13px;color:var(--fg-2);background:var(--surface);transition:background var(--t),color var(--t)}
  .modeswitch:hover{color:var(--fg)}
  .modeswitch[aria-pressed="true"]{background:var(--go-dim);color:var(--fg);border-color:var(--go)}

  main{flex:1;display:flex;flex-direction:column;align-items:stretch;
    max-width:720px;margin:0 auto;width:100%;padding:0 var(--pad) 40px}

  /* ---- verdict ---- */
  .verdict{padding:8vh 4px 5vh;text-align:center}
  .verdict .status-word{font-size:15px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--fg-3);margin:0 0 10px}
  .verdict .status-word.no{color:var(--no)}
  .verdict .status-word.go{color:var(--go)}
  .verdict h1{margin:0;font-size:clamp(30px,9vw,64px);line-height:1.05;font-weight:700;
    letter-spacing:-.01em}
  .verdict h1 .num{font-weight:700}
  .verdict .sub{margin-top:14px;font-size:17px;color:var(--fg-2)}
  .verdict .sub .num{color:var(--fg)}
  .verdict .safety{margin-top:16px;display:inline-flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:999px;background:rgba(255,92,92,.12);
    border:1px solid rgba(255,92,92,.4);color:var(--no);font-size:14px;font-weight:600}
  .verdict .safety::before{content:"⚠";font-size:14px}

  .boardpicker{margin-top:26px;display:inline-flex;gap:6px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:4px}
  .boardpicker button{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--fg-2)}
  .boardpicker button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
  .boardpicker button:hover{color:var(--fg)}

  /* ---- other spot rows ---- */
  .rows{display:flex;flex-direction:column;gap:4px;margin-top:2vh}
  .row{position:relative}
  .row>.rowbtn{width:100%;text-align:left;display:flex;align-items:center;
    justify-content:space-between;padding:16px 14px;border-radius:var(--r-sm);
    background:transparent;transition:background var(--t)}
  .row>.rowbtn:hover,.row>.rowbtn:focus-visible{background:var(--surface)}
  .row .name{font-size:16px;color:var(--fg-2)}
  .row .brief{font-size:15px;color:var(--fg-3);display:flex;align-items:center;gap:8px}
  .row .brief .num{color:var(--fg-2)}
  .row .brief.go .num{color:var(--go)}
  .row .brief.no{color:var(--no)}
  .row .detail{max-height:0;overflow:hidden;opacity:0;transition:max-height var(--t),opacity var(--t);
    padding:0 14px}
  .row>.rowbtn:hover + .detail,.row>.rowbtn:focus-visible + .detail,.row:focus-within .detail{
    max-height:200px;opacity:1;padding:2px 14px 16px}
  .detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13.5px;color:var(--fg-2)}
  .detail dt{color:var(--fg-3)}
  .detail dd{margin:0;color:var(--fg)}
  .detail .why{grid-column:1/-1;margin-top:6px;color:var(--fg-2);font-size:13px}

  /* ---- full week ---- */
  details.all{margin-top:6vh;border-top:1px solid var(--line);padding-top:18px}
  details.all summary{cursor:pointer;color:var(--fg-2);font-size:14px;list-style:none;
    display:inline-flex;align-items:center;gap:6px}
  details.all summary::-webkit-details-marker{display:none}
  details.all summary::before{content:"▸";transition:transform var(--t);color:var(--fg-3)}
  details.all[open] summary::before{transform:rotate(90deg)}
  details.all summary:hover{color:var(--fg)}
  .weektable{margin-top:16px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:6px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{color:var(--fg-3);font-weight:500}
  td.num{font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.go{background:var(--go)}.dot.zwak{background:var(--fg-3)}.dot.no{background:var(--no)}

  footer{text-align:center;padding:20px;font-size:12px;color:var(--fg-3)}
</style>
</head>
<body>

<header class="top">
  <button id="modebtn" class="modeswitch" type="button" aria-pressed="false">deze week</button>
</header>

<main>
  <section class="verdict" id="verdict" aria-live="polite"></section>
  <section class="rows" id="rows" aria-label="andere spots"></section>

  <details class="all">
    <summary>Hele week bekijken</summary>
    <div class="weektable" id="weektable"></div>
  </details>
</main>

<footer id="foot"></footer>

<script src="../../data.js"></script>
<script>
(function(){
  "use strict";
  var DAGEN = ["zo","ma","di","wo","do","vr","za"];
  var COMPASS = ["N","NNO","NO","ONO","O","OZO","ZO","ZZO","Z","ZZW","ZW","WZW","W","WNW","NW","NNW"];

  var state = { demo:false, board:"twintip" };

  function compass(deg){
    var i = Math.round(deg/22.5) % 16;
    return COMPASS[i];
  }

  function kiteSize(p50, board){
    var factor = KW.rider.boards[board];
    var size = 2.2 * KW.rider.gewicht / p50 * factor;
    return Math.round(size*2)/2;
  }

  function fmtWhen(t, demo){
    var d = new Date(t);
    var hh = String(d.getHours()).padStart(2,"0");
    if (demo){
      return DAGEN[d.getDay()] + " " + hh + ":00";
    }
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
    if (d < now && (now - d) < 3*3600*1000) return "nu · " + hh + ":00";
    if (sameDay) return "vandaag " + hh + ":00";
    if (d.toDateString() === tomorrow.toDateString()) return "morgen " + hh + ":00";
    return DAGEN[d.getDay()] + " " + hh + ":00";
  }

  function blocksFor(spot){ return state.demo ? spot.demo : spot.blokken; }

  // best non-offshore block by strength, and whether it clears the 14kn ride threshold
  function bestOf(spot){
    var blocks = blocksFor(spot) || [];
    if (!blocks.length) return null;
    var bestSafe = null, bestAny = null;
    for (var i=0;i<blocks.length;i++){
      var b = blocks[i];
      if (!bestAny || b.p50 > bestAny.p50) bestAny = b;
      if (!b.aflandig && (!bestSafe || b.p50 > bestSafe.p50)) bestSafe = b;
    }
    var ref = bestSafe || bestAny;
    var tag = "zwak";
    if (ref.aflandig) tag = "aflandig";
    else if (ref.p50 >= 14) tag = "goed";
    return { block: ref, tag: tag, spot: spot };
  }

  // Wanneer dit blok is. Elke spot kiest zijn EIGEN beste moment, dus zonder tijd
  // leest een rij alsof hij hetzelfde uur bedoelt als de kop -- precies de verwarring
  // die deze hele pagina moet wegnemen (zandmotor 09:00 vs wassenaar 12:00).
  function kortTijd(t){
    var d = new Date(t);
    if (isNaN(d)) return "";
    var dag = ["zo","ma","di","wo","do","vr","za"][d.getDay()];
    return dag + " " + String(d.getHours()).padStart(2,"0") + ":00";
  }

  function why(b){
    var rich = compass(b.dir);
    if (b.aflandig){
      return "wind komt uit " + rich + " en waait van het strand af — dat is aflandig.";
    }
    var hoekTxt = b.hoek <= 40 ? "bijna recht op het strand" :
                  b.hoek <= 90 ? "schuin op het strand" : "langs het strand";
    return "wind uit " + rich + " staat " + hoekTxt + " (" + Math.round(b.hoek) + "° t.o.v. het strand).";
  }

  function whyRow(item){
    return why(item.block);
  }

  function detailHtml(item){
    var b = item.block;
    var gust = (b.vlaag!=null) ? Math.round(b.vlaag)+" kn" : "onbekend";
    return '<dl>'+
      '<dt>bereik</dt><dd class="num">'+Math.round(b.p10)+'–'+Math.round(b.p90)+' kn</dd>'+
      '<dt>vlaag</dt><dd class="num">'+gust+(b.vlagerig?' · vlagerig':'')+'</dd>'+
      '<dt>richting</dt><dd>'+compass(b.dir)+' ('+Math.round(b.dir)+'°)</dd>'+
      '<dt>wanneer</dt><dd>'+fmtWhen(b.t, state.demo)+'</dd>'+
      '</dl><p class="why">'+whyRow(item)+'</p>';
  }

  function render(){
    var spots = KW.spots.map(bestOf).filter(Boolean);
    var vEl = document.getElementById("verdict");
    var rEl = document.getElementById("rows");
    document.getElementById("modebtn").setAttribute("aria-pressed", state.demo ? "true":"false");
    document.getElementById("modebtn").textContent = state.demo ? KW.demoLabel : "deze week (live)";

    if (!spots.length){
      vEl.innerHTML = '<p class="status-word no">geen data</p><h1>kan nu niets zeggen</h1>'+
        '<p class="sub">probeer het later opnieuw.</p>';
      rEl.innerHTML = "";
      renderTable();
      return;
    }

    // sort: 'goed' first by strongest wind, else best chance overall
    spots.sort(function(a,b){
      var rank = {goed:0, zwak:1, aflandig:2};
      if (rank[a.tag] !== rank[b.tag]) return rank[a.tag]-rank[b.tag];
      return b.block.p50 - a.block.p50;
    });

    var lead = spots[0];
    var rest = spots.slice(1);

    vEl.innerHTML = "";
    var statusWord = document.createElement("p");
    statusWord.className = "status-word" + (lead.tag==="goed" ? " go" : lead.tag==="aflandig" ? " no" : "");
    var h1 = document.createElement("h1");
    var sub = document.createElement("p");
    sub.className = "sub";

    if (lead.tag === "goed"){
      statusWord.textContent = "je kan";
      var size = kiteSize(lead.block.p50, state.board);
      h1.innerHTML = lead.spot.naam.toUpperCase() + ' · <span class="num">' +
        Math.round(lead.block.p50) + ' kn</span> · <span class="num">' + size + ' m</span>';
      sub.innerHTML = fmtWhen(lead.block.t, state.demo) + ' · vlaag <span class="num">' +
        (lead.block.vlaag!=null ? Math.round(lead.block.vlaag) : "?") + ' kn</span>';
      vEl.appendChild(statusWord); vEl.appendChild(h1); vEl.appendChild(sub);
      vEl.appendChild(boardPicker());
    } else if (lead.tag === "aflandig"){
      statusWord.textContent = "niet gaan";
      h1.textContent = "aflandig bij " + lead.spot.naam;
      sub.textContent = "wind waait van het strand af — te gevaarlijk, ook al waait het.";
      var safety = document.createElement("p");
      safety.className = "safety";
      safety.textContent = "aflandig · niet kiten";
      vEl.appendChild(statusWord); vEl.appendChild(h1); vEl.appendChild(sub); vEl.appendChild(safety);
    } else {
      statusWord.textContent = "niets deze week";
      h1.textContent = "geen kitewind";
      sub.innerHTML = "beste kans: " + lead.spot.naam + " · " + fmtWhen(lead.block.t, state.demo) +
        ' · <span class="num">~' + Math.round(lead.block.p50) + ' kn</span> (te weinig)';
      vEl.appendChild(statusWord); vEl.appendChild(h1); vEl.appendChild(sub);
    }

    // make lead itself hoverable for its own "why" — wrap sub in a focusable detail toggle
    var leadDetail = document.createElement("div");
    leadDetail.style.marginTop = "18px";
    var leadBtn = document.createElement("button");
    leadBtn.type = "button";
    leadBtn.className = "rowbtn";
    leadBtn.style.justifyContent = "center";
    leadBtn.style.color = "var(--fg-3)";
    leadBtn.style.fontSize = "13px";
    leadBtn.textContent = "details";
    var leadPanel = document.createElement("div");
    leadPanel.className = "detail";
    leadPanel.innerHTML = detailHtml(lead);
    var leadWrap = document.createElement("div");
    leadWrap.className = "row";
    leadWrap.style.maxWidth = "320px";
    leadWrap.style.margin = "18px auto 0";
    leadWrap.appendChild(leadBtn);
    leadWrap.appendChild(leadPanel);
    vEl.appendChild(leadWrap);

    // other spots
    rEl.innerHTML = "";
    rest.forEach(function(item){
      var row = document.createElement("div");
      row.className = "row";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rowbtn";
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = item.spot.naam;
      var brief = document.createElement("span");
      brief.className = "brief" + (item.tag==="goed" ? " go" : item.tag==="aflandig" ? " no" : "");
      var wanneer = kortTijd(item.block.t);
      if (item.tag === "goed"){
        brief.innerHTML = '<span class="num">' + Math.round(item.block.p50) + ' kn</span> · ' + wanneer;
      } else if (item.tag === "aflandig"){
        brief.textContent = "aflandig";
      } else {
        brief.innerHTML = '<span class="num">~' + Math.round(item.block.p50) + ' kn</span> · te weinig';
      }
      btn.appendChild(name);
      btn.appendChild(brief);
      var panel = document.createElement("div");
      panel.className = "detail";
      panel.innerHTML = detailHtml(item);
      row.appendChild(btn);
      row.appendChild(panel);
      rEl.appendChild(row);
    });

    renderTable();
  }

  function boardPicker(){
    var wrap = document.createElement("div");
    wrap.className = "boardpicker";
    wrap.setAttribute("role","group");
    wrap.setAttribute("aria-label","board");
    [["twintip","twintip"],["directional","directional"],["foil","foil"]].forEach(function(pair){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = pair[1];
      b.setAttribute("aria-pressed", state.board===pair[0] ? "true":"false");
      b.addEventListener("click", function(){ state.board = pair[0]; render(); });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function renderTable(){
    var el = document.getElementById("weektable");
    var spots = KW.spots;
    var ref = blocksFor(spots[0]) || [];
    if (!ref.length){ el.innerHTML = "<p>geen data.</p>"; return; }
    var html = "<table><thead><tr><th>tijd</th>";
    spots.forEach(function(s){ html += "<th>"+s.naam+"</th>"; });
    html += "</tr></thead><tbody>";
    ref.forEach(function(_, i){
      html += "<tr><td>"+fmtWhen(ref[i].t, state.demo)+"</td>";
      spots.forEach(function(s){
        var blocks = blocksFor(s) || [];
        var b = blocks[i];
        if (!b){ html += "<td>–</td>"; return; }
        var tag = b.aflandig ? "no" : (b.p50>=14 ? "go" : "zwak");
        var label = b.aflandig ? "aflandig" : Math.round(b.p50)+" kn";
        html += '<td class="num"><span class="dot '+tag+'"></span>'+label+"</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    el.innerHTML = html;
  }

  document.getElementById("modebtn").addEventListener("click", function(){
    state.demo = !state.demo;
    render();
  });

  var gen = new Date(KW.gegenereerd);
  document.getElementById("foot").textContent = "ververst " + gen.toLocaleString("nl-NL");

  render();
})();
</script>
</body>
</html>
