<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiteweer · uitleg</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Albert+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../stijl.css?v=20260906e">
<style>
  .doc{max-width:760px;margin:0 auto;padding:18px 20px 60px}
  .doc nav{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--zacht);margin-bottom:22px}
  .doc nav a{color:var(--zacht);text-decoration:underline;text-underline-offset:3px}
  .md h1{font-size:30px;margin:0 0 14px;line-height:1.15}
  .md h2{font-size:21px;margin:30px 0 10px}
  .md h3{font-size:17px;margin:22px 0 8px}
  .md p,.md li{font-size:15.5px;color:var(--inkt);line-height:1.6}
  .md ul,.md ol{padding-left:22px;margin:0 0 14px}
  .md p{margin:0 0 14px}
  .md a{color:var(--inkt);text-decoration:underline;text-underline-offset:3px}
  .md code{font-size:13px;background:var(--lijn-2);padding:1px 5px;border-radius:4px}
  .md pre{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r-s);padding:12px 14px;overflow:auto;font-size:13px;margin:0 0 14px}
  .md pre code{background:none;padding:0}
  .md table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:14px;background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r-s);overflow:hidden;display:block;overflow-x:auto}
  .md th,.md td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--lijn-2);white-space:nowrap}
  .md th{font-size:12px;color:var(--zacht);text-transform:uppercase;letter-spacing:.04em}
  .md blockquote{border-left:3px solid var(--lijn);margin:0 0 14px;padding:2px 14px;color:var(--zacht)}
  .md strong{font-weight:700}
</style>
</head>
<body>
<div class="doc">
  <nav><a href="../">← Kiteweer</a><a href="?p=dajk-mix.md">DAJK-mix</a><a href="?p=adr/README.md">Besluiten</a><a href="https://github.com/danielkosten/kiteweer/tree/main/docs" target="_blank" rel="noopener">bron op GitHub</a></nav>
  <article class="md" id="md">laden…</article>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
(function () {
  /* Markdown-viewer: ?p=pad/naar/bestand.md, relatief aan docs/. Links naar .md binnen docs blijven in de viewer. */
  var p = (new URLSearchParams(location.search).get("p") || "dajk-mix.md").replace(/\.\./g, "");
  var dir = p.indexOf("/") >= 0 ? p.slice(0, p.lastIndexOf("/") + 1) : "";
  var el = document.getElementById("md");
  fetch(p).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (md) {
    el.innerHTML = marked.parse(md);
    el.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href");
      if (/^https?:/.test(h)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (/\.md(#.*)?$/.test(h)) { var doel = h.replace(/^\.\//, ""); doel = doel.indexOf("../") === 0 ? doel.slice(3) : dir + doel; a.href = "?p=" + doel; }
      else if (/\.mjs$/.test(h)) a.href = "https://github.com/danielkosten/kiteweer/blob/main/" + h.replace(/^(\.\.\/)+/, "");
    });
    var h1 = el.querySelector("h1"); if (h1) document.title = "Kiteweer · " + h1.textContent;
  }).catch(function (e) { el.innerHTML = "<p>Niet gevonden: <code>" + p + "</code></p>"; });
})();
</script>
</body>
</html>
