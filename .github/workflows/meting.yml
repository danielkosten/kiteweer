name: metingen verversen

# Haalt op wat de meetstations van Rijkswaterstaat echt meten en commit meting.js.
# Daarmee staat er in de tabel naast de voorspelling wat er werkelijk stond.
# De klok staat hier UIT sinds 12-09. De gratis klok van GitHub startte maar een run per 2 tot 5 uur
# terwijl de metingen elk kwartier vernieuwen (gemeten 11 en 12-09). Dit draait nu elke 10 minuten op
# de persoonlijke VPS srv1410799: /opt/kiteweer/ververs.sh, cron in /etc/cron.d/kiteweer, log in
# /var/log/kiteweer.log. Hier blijft alleen de knop om het met de hand te starten, als terugval.
on:
  workflow_dispatch:

permissions:
  contents: write

# Nooit twee tegelijk: de vorige mag afmaken, een wachtende run vervalt (de volgende komt zo weer).
concurrency:
  group: metingen
  cancel-in-progress: false

jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node gen-meting.mjs
        continue-on-error: true
      - name: committen als er iets veranderd is
        if: always()
        run: |
          git config user.name "kiteweer-bot"
          git config user.email "kiteweer-bot@users.noreply.github.com"
          git add meting.js
          git diff --staged --quiet && echo "niets veranderd" && exit 0
          git commit -m "Metingen ververst"
          git pull --rebase --autostash origin main
          git push
