name: metingen verversen

# Haalt op wat de meetstations van Rijkswaterstaat echt meten en commit meting.js.
# Daarmee staat er in de tabel naast de voorspelling wat er werkelijk stond.
# Let op: de klok van GitHub is gratis en dus traag. We vragen elk kwartier, maar in de praktijk
# start er ongeveer elke 2 tot 5 uur één run (gemeten 11 en 12-09). Vaker echt nodig? Dan hoort
# dit op de VPS met zijn eigen klok, niet hier.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nooit twee tegelijk: de vorige mag afmaken, een wachtende run vervalt (de volgende komt zo weer).
concurrency:
  group: metingen
  cancel-in-progress: false

jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node gen-meting.mjs
        continue-on-error: true
      - name: committen als er iets veranderd is
        if: always()
        run: |
          git config user.name "kiteweer-bot"
          git config user.email "kiteweer-bot@users.noreply.github.com"
          git add meting.js
          git diff --staged --quiet && echo "niets veranderd" && exit 0
          git commit -m "Metingen ververst"
          git pull --rebase --autostash origin main
          git push
