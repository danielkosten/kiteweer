name: data verversen

# Haalt elke nacht de getijstroom op bij Rijkswaterstaat (stroom.js) en de wind bij
# Open-Meteo als terugval-bundel (uur.js), en commit wat er veranderd is.
# Handmatig starten kan ook, via de Actions-tab.
on:
  schedule:
    - cron: "20 2 * * *"   # 02:20 UTC, elke nacht
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nachtdata
  cancel-in-progress: false

jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Een hik bij een van de twee bronnen mag de andere niet meesleuren: allebei mogen falen,
      # en daarna committen we wat er wel gelukt is.
      - run: node gen-stroom.mjs
        continue-on-error: true
      - run: node gen-uur.mjs
        continue-on-error: true
      - name: committen als er iets veranderd is
        if: always()
        run: |
          git config user.name "kiteweer-bot"
          git config user.email "kiteweer-bot@users.noreply.github.com"
          git add stroom.js uur.js
          git diff --staged --quiet && echo "niets veranderd" && exit 0
          git commit -m "Stroming en terugval-bundel ververst"
          git pull --rebase --autostash origin main
          git push
